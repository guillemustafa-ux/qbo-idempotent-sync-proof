[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbo-idempotent-sync-proof"
version = "1.0.0"
description = "Runnable proof that a HubSpot -> QuickBooks Online sync can be made exactly-once across crashes, and honest about QBO Projects"
readme = "README.md"
requires-python = ">=3.10"
# No runtime dependencies on purpose: the fake QBO, the transport, the OAuth
# client and the ledger are all standard library, so the proof is verifiable
# with pytest alone and nothing here can be blamed on a framework.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["qbo_idempotent_sync_proof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli_format = "%(message)s"
addopts = "-q"
